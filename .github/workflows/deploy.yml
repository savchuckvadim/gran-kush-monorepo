# CD: build the production images, push them to ghcr.io, then deploy the installations on
# Dokploy one by one (infra/dokploy/README.md).
#
# One code, one installation per brand (packages/brand/src/installations.json):
#   api            one image for every installation — the brand comes from BRAND at run time;
#   crm/admin/site per released installation: NEXT_PUBLIC_* are inlined at BUILD time, so each
#                  brand has its own build, tagged <brand>-latest and <brand>-sha-<commit>.
# The matrix and the addresses baked into the builds come from infra/dokploy/ci-matrix.mjs.
#
# Repository secrets (deploy):
#   DOKPLOY_URL, DOKPLOY_API_KEY — the Dokploy API; without them nothing is deployed and the
#     Deploy button in Dokploy stays manual
#   DOKPLOY_COMPOSE_ID_<BRAND> (…_PAFPAF, …_INKSPACE, …_PLISPLAS) — the compose of each project;
#     an installation without one is skipped. PafPaf also takes the old DOKPLOY_COMPOSE_ID.
# Repository variables (build):
#   NEXT_PUBLIC_PLANS_PURCHASABLE — `true` once Stripe is live: the site's plan buttons lead to
#     sign-up with the plan; empty = «coming soon, try it free»

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Images to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "images=$(node infra/dokploy/ci-matrix.mjs)" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.app }} ${{ matrix.brand }}
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      # ghcr image paths must be lowercase; github.repository may not be. Brand builds share the
      # app's package and differ by tag prefix, so a new brand needs no new package.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "prefix=${{ matrix.brand && format('{0}-', matrix.brand) || '' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # next/font fetches Google Fonts during the build, and now and then Google answers one
      # runner with font URLs Turbopack cannot parse («next/font/google queries have exactly one
      # entry», 24.10.2026: crm pafpaf red, crm inkspace from the same commit green). One more
      # attempt with the layers already cached gets past such a flake; a real error fails twice.
      - name: Build & push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with: &build-inputs
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.prefix }}sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.prefix }}latest
          build-args: |
            APP=${{ matrix.app }}
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_BRAND=${{ matrix.brand }}
            NEXT_PUBLIC_SITE=${{ matrix.brand }}
            NEXT_PUBLIC_SERVER_URL=${{ matrix.site_url }}
            NEXT_PUBLIC_API_URL=${{ matrix.api_url }}
            NEXT_PUBLIC_CRM_URL=${{ matrix.crm_url }}
            NEXT_PUBLIC_MEMBER_URL=${{ matrix.member_url }}
            NEXT_PUBLIC_MAIN_SITE_URL=${{ matrix.site_url }}
            NEXT_PUBLIC_SITE_URL=${{ matrix.site_url }}
            NEXT_PUBLIC_PLANS_PURCHASABLE=${{ vars.NEXT_PUBLIC_PLANS_PURCHASABLE }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.brand }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.brand }}

      - name: Build & push (second attempt)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with: *build-inputs

  # Job-level `if` cannot read the secrets context, so a tiny job exports
  # whether the Dokploy API is configured.
  dokploy-check:
    name: Check deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: check
        run: echo "dokploy=${{ secrets.DOKPLOY_URL != '' && secrets.DOKPLOY_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
    outputs:
      dokploy: ${{ steps.check.outputs.dokploy }}

  # Dokploy pulls the tags on deploy, so it must start only after every image is
  # pushed. Its own Autodeploy (git push hook) would race the build — keep it off.
  dokploy:
    name: Deploy on Dokploy
    needs: [build, dokploy-check]
    if: needs.dokploy-check.outputs.dokploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Deploy installations one by one
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_COMPOSE_ID_PAFPAF: ${{ secrets.DOKPLOY_COMPOSE_ID_PAFPAF }}
          DOKPLOY_COMPOSE_ID_INKSPACE: ${{ secrets.DOKPLOY_COMPOSE_ID_INKSPACE }}
          DOKPLOY_COMPOSE_ID_PLISPLAS: ${{ secrets.DOKPLOY_COMPOSE_ID_PLISPLAS }}
        run: node infra/dokploy/deploy.mjs "${{ github.sha }}"
