# CD: build the four production images, push them to ghcr.io, then deploy to
# the server over SSH (documentation/tasks/deployment.md §3, шаги 4–5).
#
# While the server does not exist yet, the deploy job is skipped automatically:
# it only runs when the SSH_* secrets are configured. The build half still runs
# on every push to main, so images are always ready in the registry.
#
# Repository secrets (deploy):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY — dedicated deploy key, not a personal one
# Repository variables (build/smoke):
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_CRM_URL, NEXT_PUBLIC_MAIN_SITE_URL —
#     inlined into the Next.js bundles at BUILD time (changing them = rebuild)
#   SMOKE_CHECK_URL — e.g. https://api.<domain>/health; smoke step skipped if empty

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: infra/docker/api.Dockerfile
          - app: crm
            dockerfile: infra/docker/next.Dockerfile
          - app: web
            dockerfile: infra/docker/next.Dockerfile
          - app: admin
            dockerfile: infra/docker/next.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # ghcr image paths must be lowercase; github.repository may not be.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CRM_URL=${{ vars.NEXT_PUBLIC_CRM_URL }}
            NEXT_PUBLIC_MAIN_SITE_URL=${{ vars.NEXT_PUBLIC_MAIN_SITE_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Job-level `if` cannot read the secrets context, so a tiny job exports
  # "are the SSH secrets configured" as an output for the deploy job.
  server-check:
    name: Check deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: check
        run: echo "configured=${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
    outputs:
      configured: ${{ steps.check.outputs.configured }}

  deploy:
    name: Deploy to server
    needs: [build, server-check]
    if: needs.server-check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull images & restart stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/gran-kush
          git fetch origin main
          git checkout main
          git pull --ff-only
          export TAG=sha-${{ github.sha }}
          # The TLS overlay is opt-in by the presence of the certificate: drop
          # one into infra/docker/nginx/certs/ and every later deploy keeps :443.
          # Without this check a deploy would silently recreate nginx on :80 only.
          FILES="-f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.deploy.yml"
          if [ -f infra/docker/nginx/certs/origin.pem ]; then
            FILES="$FILES -f infra/compose/docker-compose.tls.yml"
            echo "TLS overlay enabled"
          else
            echo "No certificate found — serving plain HTTP on :80"
          fi
          docker compose --env-file infra/compose/.env $FILES pull
          docker compose --env-file infra/compose/.env $FILES up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Smoke check
        if: vars.SMOKE_CHECK_URL != ''
        run: |
          sleep 20
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors \
            "${{ vars.SMOKE_CHECK_URL }}" > /dev/null
          echo "Smoke check OK: ${{ vars.SMOKE_CHECK_URL }}"
