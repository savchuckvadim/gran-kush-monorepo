# Generated by infra/dokploy/render.mjs from templates/ — edit the template, not this file.
# Ink Space on Dokploy: one Compose service in its own Dokploy project on a shared
# server. Setup, domains and the order of the first deploy: infra/dokploy/README.md;
# variables: .env.example next to this file (real values live only in Dokploy).
#
# - One code, one installation per brand (pafpaf, inkspace, plisplas): each has its own
#   project, database, Redis and secrets. BRAND below picks the brand in the API; the
#   CRM, admin and site images are built per brand (tag inkspace-…).
# - No host ports. Traefik (Dokploy → Domains) routes each host name to port
#   3000 of a inkspace-* service, so nothing collides with other projects.
# - Postgres and Redis stay on the project's internal network.
# - Images come from ghcr.io: .github/workflows/deploy.yml builds them on every
#   push to main, the server builds nothing. pull_policy: always makes every
#   Dokploy deploy fetch the current tag.
# - The inkspace- prefix matters: dokploy-network is shared by every project on
#   the server, and a bare "api" or "site" could resolve to another container.
# - Memory limits and log rotation protect the other projects on the server.
# - The cabinet (app.) is part of the CRM app: app.${DOMAIN} is a second
#   domain of inkspace-crm (port 3000), the CRM proxy routes it by host.
# - No YAML anchors on purpose: Dokploy rewrites this file to add its domain
#   labels, and every service must keep both networks however it is parsed.

services:
  inkspace-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in Dokploy → Environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy → Environment}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in Dokploy → Environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512M

  inkspace-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 128M

  # api.${DOMAIN}
  inkspace-api:
    image: ${IMAGE_PREFIX:-ghcr.io/savchuckvadim/gran-kush-monorepo}/api:${TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    networks: [default, dokploy-network]
    environment:
      NODE_ENV: production
      PORT: 3000
      # The installation: product name, kind of portal, modules (packages/brand)
      BRAND: inkspace
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inkspace-postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://inkspace-redis:6379
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      # Cloudflare and Traefik in front: two proxies, so req.ip is the visitor, not Cloudflare.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      CORS_ORIGIN: https://crm.${DOMAIN:-ink.space},https://app.${DOMAIN:-ink.space},https://admin.${DOMAIN:-ink.space}
      CRM_FRONTEND_URL: https://crm.${DOMAIN:-ink.space}
      MEMBER_FRONTEND_URL: https://app.${DOMAIN:-ink.space}
      # Google OAuth redirect URIs are built from this base (README.md → «Вход через Google»)
      API_PUBLIC_URL: https://api.${DOMAIN:-ink.space}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Session hint for the CRM/cabinet proxies; token cookies stay host-only on api.
      AUTH_HINT_COOKIE_DOMAIN: .${DOMAIN:-ink.space}
      AUTH_COOKIE_SECURE: "true"
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in Dokploy → Environment}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Dokploy → Environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in Dokploy → Environment}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY in Dokploy → Environment}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_LOGIN: ${MAIL_LOGIN:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Empty: the brand's name
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      TG_BOT_API_KEY: ${TG_BOT_API_KEY:-}
      TG_BOT_CHAT_ID: ${TG_BOT_CHAT_ID:-}
      TG_CLIENT_BOT_API_KEY: ${TG_CLIENT_BOT_API_KEY:-}
      # имя бота кабинета без @: виджет «Войти через Telegram»; без него и токена кнопки нет
      TG_CLIENT_BOT_USERNAME: ${TG_CLIENT_BOT_USERNAME:-}
      # бот входа в CRM (свой домен crm.): без токена и имени кнопки Telegram в CRM нет
      TG_CRM_BOT_API_KEY: ${TG_CRM_BOT_API_KEY:-}
      TG_CRM_BOT_USERNAME: ${TG_CRM_BOT_USERNAME:-}
      PLATFORM_BOOTSTRAP_ADMIN_EMAIL: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:-}
      PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:-}
      PLATFORM_BOOTSTRAP_ADMIN_NAME: ${PLATFORM_BOOTSTRAP_ADMIN_NAME:-ADMIN}
      PLATFORM_BOOTSTRAP_ADMIN_ENABLED: "true"
      PLATFORM_BOOTSTRAP_NEED_ADMIN_SEED: "true"
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      # Оплата (documentation/backend/BILLING.md) — только у брендов с модулем billing.
      # Без ключей онлайн-оплата выключена, работает ручное продление из админки
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-365}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
    depends_on:
      inkspace-postgres:
        condition: service_healthy
      inkspace-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 768M

  # crm.${DOMAIN} and app.${DOMAIN}
  inkspace-crm:
    image: ${IMAGE_PREFIX:-ghcr.io/savchuckvadim/gran-kush-monorepo}/crm:inkspace-${TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    networks: [default, dokploy-network]
    environment:
      HOSTNAME: 0.0.0.0
    depends_on: [inkspace-api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512M

  # admin.${DOMAIN}: platform admin
  inkspace-admin:
    image: ${IMAGE_PREFIX:-ghcr.io/savchuckvadim/gran-kush-monorepo}/admin:inkspace-${TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    networks: [default, dokploy-network]
    environment:
      HOSTNAME: 0.0.0.0
    depends_on: [inkspace-api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512M

  # ${DOMAIN}: product site, Payload admin at /admin
  inkspace-site:
    image: ${IMAGE_PREFIX:-ghcr.io/savchuckvadim/gran-kush-monorepo}/site:inkspace-${TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    networks: [default, dokploy-network]
    environment:
      HOSTNAME: 0.0.0.0
      # Payload creates this database on first start and applies its migrations.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inkspace-postgres:5432/site
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in Dokploy → Environment}
      PAYLOAD_ADMIN_EMAIL: ${PAYLOAD_ADMIN_EMAIL:-}
      PAYLOAD_ADMIN_PASSWORD: ${PAYLOAD_ADMIN_PASSWORD:-}
      PAYLOAD_SEED_IF_EMPTY: ${PAYLOAD_SEED_IF_EMPTY:-false}
      BILLING_API_URL: http://inkspace-api:3000
    volumes:
      - site_media:/app/apps/site/media
    depends_on:
      inkspace-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  site_media:
