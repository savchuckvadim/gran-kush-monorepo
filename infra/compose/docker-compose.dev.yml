# Dev infrastructure — databases only (Postgres + Redis).
# Apps run on the host via `pnpm dev`; this just brings up the data stores.
#
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#   docker compose -f infra/compose/docker-compose.dev.yml down
#
# Values default to what apps/api/.env expects; override via a shell env
# or `--env-file apps/api/.env`.

name: gran-kush-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: gran-kush-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kush}
      POSTGRES_DB: ${POSTGRES_DB:-bro-crm}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kush} -d ${POSTGRES_DB:-bro-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off on every `pnpm docker:dev`: the same roles as in production (infra/postgres).
  # Connect the API with crm_app (DATABASE_URL), migrate with crm_owner (DATABASE_OWNER_URL),
  # the site with site_app. The superuser URLs keep working too.
  db-roles:
    image: postgres:16-alpine
    restart: "no"
    command: ["sh", "/opt/postgres/apply-roles.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kush}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kush}
      CRM_DB: ${POSTGRES_DB:-bro-crm}
      SITE_DB: site
      DB_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-crm_owner}
      DB_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-crm_app}
      DB_SITE_PASSWORD: ${POSTGRES_SITE_PASSWORD:-site_app}
      # prisma migrate dev creates a shadow database
      DB_OWNER_CREATEDB: "true"
    volumes:
      - ../postgres:/opt/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gran-kush-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
